<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e9eeeb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sổ Thu Chi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800&display=swap">
<style>
/* Bố cục: app một màn hình cho ngón cái. Số tiền ở trên, danh mục ở giữa, bàn phím số ở đáy. */
:root{
  --bg:#e9eeeb; --surface:#fafcfb; --raise:#ffffff; --ink:#15221d; --muted:#5a6a63; --line:#cfd9d4;
  --accent:#0d6a52; --on-accent:#f4fbf8; --income:#1c7a3e; --warn:#a8321f; --work:#7a5a12;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Big Shoulders Display","Be Vietnam Pro","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#161f1c; --raise:#1d2824; --ink:#e5ece9; --muted:#93a39c; --line:#2b3833;
  --accent:#4cc4a0; --on-accent:#06231a; --income:#6fd28f; --warn:#f08a75; --work:#e0b85a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#161f1c; --raise:#1d2824; --ink:#e5ece9; --muted:#93a39c; --line:#2b3833;
  --accent:#4cc4a0; --on-accent:#06231a; --income:#6fd28f; --warn:#f08a75; --work:#e0b85a; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

.app{height:100%;max-width:460px;margin:0 auto;padding-inline:16px;padding-block:10px 12px;
  display:flex;flex-direction:column;gap:10px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:16px}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.status{font-size:12px;color:var(--muted);min-height:17px}
.status.bad{color:var(--warn)}

.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* ---- Ghi ---- */
.amount{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.amount .big{font-size:52px;font-weight:800;line-height:1;min-width:0;overflow:hidden;white-space:nowrap}
.amount .big.zero{color:var(--muted);opacity:.55}
.amount .big.thu{color:var(--income)}
.amount .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.amount .today{font-size:12px;color:var(--muted);text-align:right}
.amount .today b{color:var(--ink);font-weight:600}
.kind{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kind button{border:0;background:none;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.kind button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.amount.nudge{animation:nudge .18s 2;border-color:var(--warn)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px dashed var(--accent);background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--accent);font-weight:600}

.cats{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.glabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.grid button{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:11px 2px;font-size:13px;font-weight:600;
  min-width:0;overflow-wrap:anywhere;line-height:1.2}
.grid button:active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.grid.work button{border-color:var(--work)}
.grid button:disabled{opacity:.45}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;flex:none}
.pad button{background:var(--surface);border:1px solid var(--line);border-radius:12px;height:50px;font-size:26px;font-weight:600}
.pad button:active{background:var(--line)}
.pad .fn{font-family:var(--f-body);font-size:15px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);text-align:center;flex:none}

/* ---- Tháng ---- */
#vMonth{overflow-y:auto;gap:14px}
.mnav{display:flex;align-items:center;justify-content:space-between}
.mnav button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:36px;font-size:16px}
.mnav strong{font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stat span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.stat.thu b{color:var(--income)}
.stat.work b{color:var(--work)}
.net{font-size:13px;color:var(--muted)}
.net b{color:var(--ink)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar.work .fill{background:var(--work)}
.bar .v{font-size:17px;font-weight:600}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;padding:10px 0 4px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:baseline;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;text-align:left}
.row .c{font-weight:600;flex:none}
.row .n{flex:1;min-width:0;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{font-size:19px;font-weight:600;flex:none}
.row .a.thu{color:var(--income)}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}

/* ---- Toast + sheet ---- */
.toast{position:absolute;left:16px;right:16px;bottom:250px;background:var(--ink);color:var(--bg);border-radius:12px;
  padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:14px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast span{flex:1;min-width:0}
.toast button{border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;flex:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:8;display:flex;align-items:flex-end}
.sheet{background:var(--surface);border-radius:16px 16px 0 0;padding:16px;width:100%;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:16px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.f input,.f select{font:inherit;font-size:16px;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px}
.acts button{flex:1;border-radius:10px;padding:11px;font-weight:600;border:1px solid var(--line);background:var(--raise)}
.acts .primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.acts .danger{color:var(--warn);border-color:var(--warn)}
@media (prefers-reduced-motion: reduce){ .amount.nudge{animation:none} }

html,body{overscroll-behavior:none}
button{user-select:none;-webkit-user-select:none}
.backup{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.backup p{margin:0;font-size:13px;color:var(--muted)}
.backup .acts button{font-size:14px}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="brand">Sổ Thu Chi</div>
    <div class="tabs" role="tablist">
      <button id="tabLog" role="tab" aria-selected="true">Ghi</button>
      <button id="tabMonth" role="tab" aria-selected="false">Tháng này</button>
    </div>
  </div>
  <div class="status" id="status"></div>

  <div class="view" id="vLog">
    <div class="amount" id="amountBox">
      <div class="big num zero" id="big">0</div>
      <div class="side">
        <div class="kind">
          <button id="kChi" aria-pressed="true">Chi</button>
          <button id="kThu" aria-pressed="false">Thu</button>
        </div>
        <div class="today">Hôm nay đã chi <b class="num" id="todaySum">0</b></div>
      </div>
    </div>
    <div class="chips" id="chips" hidden></div>
    <div class="cats" id="cats"></div>
    <div class="hint" id="hint">Gõ số theo nghìn đồng (45 = 45.000 đ), rồi chạm danh mục để lưu.</div>
    <div class="pad num" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="000">000</button><button data-k="0">0</button><button data-k="del" class="fn" aria-label="Xóa số cuối">⌫ Xóa</button>
    </div>
  </div>

  <div class="view" id="vMonth" hidden>
    <div class="mnav">
      <button id="mPrev" aria-label="Tháng trước">‹</button>
      <strong id="mTitle"></strong>
      <button id="mNext" aria-label="Tháng sau">›</button>
    </div>
    <div class="stats">
      <div class="stat"><span>Gia đình chi</span><b class="num" id="sHome">0</b></div>
      <div class="stat work"><span>Công việc chi</span><b class="num" id="sWork">0</b></div>
      <div class="stat thu"><span>Thu về</span><b class="num" id="sIn">0</b></div>
    </div>
    <div class="net" id="net"></div>
    <section><h2>Chi theo danh mục</h2><div class="bars" id="bars"></div></section>
    <section><h2>Các khoản đã ghi</h2><div id="list"></div></section>
    <section class="backup"><h2>Đồng bộ Google Sheets</h2>
      <p id="syncInfo"></p>
      <div id="syncForm" class="backup">
        <label class="f">Địa chỉ Web App<input id="sUrl" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec"></label>
        <label class="f">Mã khóa<input id="sKey" autocomplete="off"></label>
      </div>
      <div class="acts"><button type="button" id="sGo" class="primary">Kết nối</button><button type="button" id="sOff" hidden>Ngắt kết nối</button></div>
    </section>
    <section class="backup"><h2>Sao lưu</h2>
      <p id="bkInfo"></p>
      <div class="acts"><button type="button" id="bkOut" class="primary">Xuất file sao lưu</button><button type="button" id="bkIn">Nhập từ file</button></div>
      <input type="file" id="bkFile" accept="application/json,.json" hidden>
    </section>
  </div>

  <div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastNote">Ghi chú</button><button id="toastUndo">Hoàn tác</button></div>

  <div class="scrim" id="scrim" hidden>
    <form class="sheet" id="sheet">
      <h3>Sửa khoản</h3>
      <div class="two">
        <label class="f">Số tiền (nghìn đồng)<input id="eAmt" inputmode="numeric" pattern="[0-9]*" required></label>
        <label class="f">Ngày<input id="eDate" type="date" required></label>
      </div>
      <label class="f">Danh mục<select id="eCat"></select></label>
      <label class="f">Ghi chú<input id="eNote" maxlength="80" placeholder="Ví dụ: ăn trưa với khách"></label>
      <div class="acts">
        <button type="button" class="danger" id="eDel">Xóa</button>
        <button type="button" id="eCancel">Đóng</button>
        <button type="submit" class="primary">Lưu</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
const CATS = [
  {id:"an",n:"Ăn uống",t:"chi"},{id:"cafe",n:"Cà phê",t:"chi"},{id:"cho",n:"Đi chợ",t:"chi"},{id:"dilai",n:"Đi lại",t:"chi"},
  {id:"nha",n:"Nhà cửa",t:"chi"},{id:"con",n:"Con cái",t:"chi"},{id:"suckhoe",n:"Sức khỏe",t:"chi"},{id:"muasam",n:"Mua sắm",t:"chi"},
  {id:"giaitri",n:"Giải trí",t:"chi"},{id:"hieuhi",n:"Hiếu hỉ",t:"chi"},{id:"khac",n:"Khác",t:"chi"},
  {id:"phanmem",n:"Phần mềm",t:"chi",w:1},{id:"trade",n:"Phí trade",t:"chi",w:1},{id:"thietbi",n:"Thiết bị",t:"chi",w:1},
  {id:"congtrinh",n:"Công trình",t:"thu",w:1},{id:"payout",n:"Payout",t:"thu",w:1},{id:"thukhac",n:"Thu khác",t:"thu"}
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("vi-VN");
const short = n => n>=1e6 ? (n/1e6).toLocaleString("vi-VN",{maximumFractionDigits:1})+"tr" : Math.round(n/1e3)+"k";
const pad2 = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const TODAY = () => ymd(new Date());
const NOW_YM = () => TODAY().slice(0,7);

let buf = "", kind = "chi", viewYm = NOW_YM(), txs = [], store = null, lastId = null, editing = null, toastTimer = 0, delArmed = false;

/* ---------- lưu trữ ---------- */
function localStore(){
  const KEY = "sothuchi.tx"; let all = [], cb = null, ym = null;
  try{ all = JSON.parse(localStorage.getItem(KEY) || "[]") }catch(e){}
  const push = () => { try{ localStorage.setItem(KEY, JSON.stringify(all)) }catch(e){} cb && cb(all.filter(t=>t.ym===ym)) };
  return {
    watch(m, f){ ym = m; cb = f; f(all.filter(t=>t.ym===ym)) },
    async add(t){ const id = "l"+Date.now()+Math.random().toString(36).slice(2,6); const r = {...t,id,u:Date.now()}; all.push(r); push(); onWrite("upsert", r); return id },
    async save(id, t){ const r = {...t,id,u:Date.now()}; all = all.map(x=>x.id===id?r:x); push(); onWrite("upsert", r) },
    async remove(id){ const old = all.find(x=>x.id===id); all = all.filter(x=>x.id!==id); push(); if(old) onWrite("delete", {...old, u:Date.now()}) },
    reconcile(srv, del, pending){
      const m = new Map(all.map(t=>[t.id,t])); const seen = new Set();
      for(const id of del){ seen.add(id); if(!pending.has(id)) m.delete(id) }
      for(const s of srv){ seen.add(s.id); if(pending.has(s.id) || !/^\d{4}-\d{2}-\d{2}$/.test(s.d)) continue; const l = m.get(s.id);
        if(!l || (s.u||0) > (l.u||0)) m.set(s.id, {...s, ym:s.d.slice(0,7)}) }
      all = [...m.values()]; push();
      return all.filter(t => !seen.has(t.id));
    },
    all(){ return all.slice() },
    merge(list){ const m = new Map(all.map(t=>[t.id,t])); for(const t of list) m.set(t.id,t); all = [...m.values()]; push(); return all.length }
  };
}
async function boot(){
  store = localStore();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist() }catch(e){}
  subscribe(); renderCats(); renderBackup();
  syncNow();
  window.addEventListener("online", syncNow);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") syncNow() });
}
function subscribe(){
  store.watch(viewYm, list => { txs = list.slice().sort((a,b)=> a.d===b.d ? (b.ts||0)-(a.ts||0) : (a.d<b.d?1:-1)); renderAll() },
    () => setStatus("Mất kết nối với sổ. Tải lại trang để tiếp tục.", true));
}
function setStatus(t, bad){ $("status").textContent = t; $("status").classList.toggle("bad", !!bad) }

/* ---------- Ghi ---------- */
function renderAmount(){
  const b = $("big"); const v = buf ? parseInt(buf,10)*1000 : 0;
  b.textContent = fmt(v) + (buf ? " đ" : "");
  b.classList.toggle("zero", !buf); b.classList.toggle("thu", kind==="thu" && !!buf);
  const L = b.textContent.length; b.style.fontSize = L > 11 ? "30px" : L > 8 ? "38px" : L > 6 ? "46px" : "";
}
function renderCats(){
  const box = $("cats"); box.textContent = "";
  const groups = [["Gia đình", c=>!c.w], ["Công việc", c=>c.w]];
  for(const [label, pick] of groups){
    const list = CATS.filter(c=>c.t===kind && pick(c)); if(!list.length) continue;
    const l = document.createElement("div"); l.className = "glabel"; l.textContent = label; box.append(l);
    const g = document.createElement("div"); g.className = "grid" + (label==="Công việc" ? " work" : "");
    for(const c of list){ const b = document.createElement("button"); b.textContent = c.n; b.disabled = !store;
      b.onclick = () => commit(c.id); g.append(b) }
    box.append(g);
  }
}
function setKind(k){ kind = k; $("kChi").setAttribute("aria-pressed", k==="chi"); $("kThu").setAttribute("aria-pressed", k==="thu"); renderCats(); renderAmount() }
function nudge(){ const a = $("amountBox"); a.classList.remove("nudge"); void a.offsetWidth; a.classList.add("nudge");
  $("hint").textContent = "Gõ số tiền trước, rồi chạm danh mục."; setTimeout(()=>a.classList.remove("nudge"), 500) }

async function commit(catId, amtOverride){
  if(!store) return;
  const amt = amtOverride || (buf ? parseInt(buf,10)*1000 : 0);
  if(!amt){ nudge(); return }
  const d = TODAY(); const c = CAT[catId];
  const t = {ym:d.slice(0,7), d, amt, type:c.t, cat:catId, note:"", ts:Date.now()};
  try{ navigator.vibrate && navigator.vibrate(12) }catch(e){}
  try{
    lastId = await store.add(t); renderBackup();
    buf = ""; if(kind!=="chi") setKind("chi"); renderAmount();
    showToast("Đã ghi " + fmt(amt) + " đ · " + c.n, true);
  }catch(e){ showToast(e && e.code==="invalid_argument" ? "Tài khoản này không có quyền ghi vào sổ." : "Chưa lưu được. Chạm danh mục lần nữa.", false) }
}
function showToast(text, withActions){
  $("toastText").textContent = text; $("toastNote").hidden = $("toastUndo").hidden = !withActions;
  $("toast").hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ $("toast").hidden = true }, 6000);
}
$("toastUndo").onclick = async () => { const id = lastId; $("toast").hidden = true; if(!id) return;
  try{ await store.remove(id); lastId = null; showToast("Đã bỏ khoản vừa ghi.", false) }catch(e){ showToast("Chưa bỏ được. Thử lại trong mục Tháng này.", false) } };
$("toastNote").onclick = () => { $("toast").hidden = true; const t = txs.find(x=>x.id===lastId); if(t) openEdit(t, true) };

$("pad").onclick = e => { const k = e.target.closest("button")?.dataset.k; if(!k) return;
  if(k==="del") buf = buf.slice(0,-1);
  else if(k==="000"){ if(buf && buf.length<=4) buf += "000" }
  else if(buf.length<7 && !(k==="0" && !buf)) buf += k;
  renderAmount(); };
$("kChi").onclick = () => setKind("chi");
$("kThu").onclick = () => setKind("thu");

function renderChips(){
  const count = {};
  for(const t of txs){ const k = t.cat+"|"+t.amt; count[k] = (count[k]||0)+1 }
  let top = Object.entries(count).filter(([k,n])=>n>=2 && CAT[k.split("|")[0]]).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k])=>k);
  try{ if(viewYm===NOW_YM() && top.length) localStorage.setItem("sothuchi.chips", JSON.stringify(top));
       else if(!top.length) top = JSON.parse(localStorage.getItem("sothuchi.chips")||"[]").filter(k=>CAT[String(k).split("|")[0]]) }catch(e){}
  const box = $("chips"); box.textContent = ""; box.hidden = !top.length;
  for(const k of top){ const [cat, amt] = k.split("|"); const b = document.createElement("button");
    b.textContent = CAT[cat].n + " " + short(+amt); b.onclick = () => commit(cat, +amt); box.append(b) }
}

/* ---------- Tháng ---------- */
function renderMonth(){
  const [y,m] = viewYm.split("-"); $("mTitle").textContent = "Tháng " + (+m) + "/" + y;
  $("mNext").disabled = viewYm >= NOW_YM();
  let home=0, work=0, inc=0; const by = {};
  for(const t of txs){ const c = CAT[t.cat] || CAT.khac;
    if(t.type==="thu") inc += t.amt; else { (c.w ? work += t.amt : home += t.amt); by[c.id] = (by[c.id]||0) + t.amt } }
  $("sHome").textContent = short(home); $("sWork").textContent = short(work); $("sIn").textContent = short(inc);
  const net = inc - home - work;
  $("net").textContent = ""; if(txs.length){ $("net").append("Thu trừ chi: "); const b = document.createElement("b"); b.className = "num";
    b.textContent = (net<0?"−":"+") + fmt(Math.abs(net)) + " đ"; $("net").append(b) }

  const bars = $("bars"); bars.textContent = ""; const rows = Object.entries(by).sort((a,b)=>b[1]-a[1]); const max = rows.length ? rows[0][1] : 1;
  if(!rows.length) bars.innerHTML = '<div class="empty">Chưa có khoản chi nào trong tháng này.</div>';
  for(const [id, v] of rows){ const c = CAT[id]; const r = document.createElement("div"); r.className = "bar" + (c.w ? " work" : "");
    r.innerHTML = '<div></div><div class="track"><div class="fill"></div></div><div class="v num"></div>';
    r.children[0].textContent = c.n; r.querySelector(".fill").style.width = Math.max(3, v/max*100) + "%"; r.children[2].textContent = fmt(v); bars.append(r) }

  const list = $("list"); list.textContent = "";
  if(!txs.length){ list.innerHTML = '<div class="empty">Sổ tháng này còn trống. Sang tab Ghi, gõ số tiền rồi chạm danh mục.</div>'; return }
  let cur = null, daySum = {};
  for(const t of txs) if(t.type!=="thu") daySum[t.d] = (daySum[t.d]||0) + t.amt;
  for(const t of txs){
    if(t.d !== cur){ cur = t.d; const h = document.createElement("div"); h.className = "day"; const [yy,mm,dd] = t.d.split("-");
      const a = document.createElement("span"); a.textContent = t.d===TODAY() ? "Hôm nay" : "Ngày " + (+dd) + "/" + (+mm);
      const b = document.createElement("span"); b.textContent = "chi " + fmt(daySum[t.d]||0); h.append(a,b); list.append(h) }
    const c = CAT[t.cat] || CAT.khac; const r = document.createElement("button"); r.className = "row";
    r.innerHTML = '<span class="c"></span><span class="n"></span><span class="a num"></span>';
    r.children[0].textContent = c.n; r.children[1].textContent = t.note || "";
    r.children[2].textContent = (t.type==="thu" ? "+" : "") + fmt(t.amt); if(t.type==="thu") r.children[2].classList.add("thu");
    r.onclick = () => openEdit(t); list.append(r);
  }
}
function renderAll(){
  if(viewYm===NOW_YM()){ const d = TODAY(); $("todaySum").textContent = fmt(txs.filter(t=>t.d===d && t.type!=="thu").reduce((s,t)=>s+t.amt,0)) + " đ" }
  renderChips(); renderMonth();
}
function shiftMonth(n){ const [y,m] = viewYm.split("-").map(Number); const d = new Date(y, m-1+n, 1); viewYm = d.getFullYear()+"-"+pad2(d.getMonth()+1); if(store) subscribe() }
$("mPrev").onclick = () => shiftMonth(-1);
$("mNext").onclick = () => shiftMonth(1);

function showTab(month){
  $("vLog").hidden = month; $("vMonth").hidden = !month;
  $("tabLog").setAttribute("aria-selected", !month); $("tabMonth").setAttribute("aria-selected", month);
  if(!month && viewYm !== NOW_YM()){ viewYm = NOW_YM(); if(store) subscribe() }
}
$("tabLog").onclick = () => showTab(false);
$("tabMonth").onclick = () => showTab(true);

/* ---------- Sửa ---------- */
function openEdit(t, focusNote){
  editing = t; delArmed = false; $("eDel").textContent = "Xóa";
  $("eAmt").value = Math.round(t.amt/1000); $("eDate").value = t.d; $("eNote").value = t.note || "";
  const sel = $("eCat"); sel.textContent = "";
  for(const c of CATS){ const o = document.createElement("option"); o.value = c.id; o.textContent = (c.t==="thu" ? "Thu · " : "Chi · ") + c.n; sel.append(o) }
  sel.value = CAT[t.cat] ? t.cat : "khac";
  $("scrim").hidden = false; if(focusNote) $("eNote").focus();
}
function closeEdit(){ $("scrim").hidden = true; editing = null }
$("eCancel").onclick = closeEdit;
$("scrim").onclick = e => { if(e.target === $("scrim")) closeEdit() };
$("eDel").onclick = async () => {
  if(!delArmed){ delArmed = true; $("eDel").textContent = "Chạm lần nữa"; return }
  const id = editing.id; closeEdit();
  try{ await store.remove(id) }catch(e){ showToast("Chưa xóa được. Thử lại.", false) }
};
$("sheet").onsubmit = async e => {
  e.preventDefault(); if(!editing) return;
  const k = parseInt($("eAmt").value, 10), d = $("eDate").value, cat = $("eCat").value;
  if(!(k>0) || !/^\d{4}-\d{2}-\d{2}$/.test(d)){ showToast("Số tiền và ngày chưa hợp lệ.", false); return }
  const t = {ym:d.slice(0,7), d, amt:k*1000, type:CAT[cat].t, cat, note:$("eNote").value.trim().slice(0,80), ts:editing.ts || Date.now()};
  const id = editing.id; closeEdit();
  try{ await store.save(id, t) }catch(err){ showToast("Chưa lưu được thay đổi. Thử lại.", false) }
};

/* ---------- Sao lưu ---------- */
function renderBackup(){
  let last = 0; try{ last = +localStorage.getItem("sothuchi.backup") || 0 }catch(e){}
  const n = store ? store.all().length : 0;
  const days = last ? Math.floor((Date.now()-last)/864e5) : null;
  $("bkInfo").textContent = "Sổ có " + n + " khoản trên máy này. " +
    (last ? (days===0 ? "Đã sao lưu hôm nay." : "Sao lưu gần nhất: " + days + " ngày trước.") : "Chưa sao lưu lần nào.");
  renderSync();
}
$("bkOut").onclick = async () => {
  const name = "so-thu-chi-" + TODAY() + ".json";
  const text = JSON.stringify({app:"so-thu-chi", v:1, exported:new Date().toISOString(), tx:store.all()});
  try{
    const file = new File([text], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}) }
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click(); a.remove() }
    try{ localStorage.setItem("sothuchi.backup", Date.now()) }catch(e){}
    renderBackup(); showToast("Đã xuất " + name, false);
  }catch(e){ if(!e || e.name!=="AbortError") showToast("Chưa xuất được file. Thử lại.", false) }
};
$("bkIn").onclick = () => $("bkFile").click();
$("bkFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  try{
    const data = JSON.parse(await f.text()); const list = Array.isArray(data) ? data : data.tx;
    const ok = list.filter(t => t && t.id && /^\d{4}-\d{2}-\d{2}$/.test(t.d) && t.amt > 0 && (t.type==="chi" || t.type==="thu"))
      .map(t => ({id:String(t.id), ym:t.d.slice(0,7), d:t.d, amt:+t.amt, type:t.type, cat:String(t.cat||"khac"), note:String(t.note||"").slice(0,80), ts:+t.ts||0}));
    if(!ok.length) throw 0;
    store.merge(ok); renderBackup(); showToast("Đã nhập " + ok.length + " khoản từ file.", false);
  }catch(err){ showToast("File này không phải file sao lưu của Sổ Thu Chi.", false) }
};

/* ---------- Đồng bộ Google Sheets ---------- */
const SYNC_KEY = "sothuchi.sync", OUT_KEY = "sothuchi.outbox";
let sync = null, outbox = [], syncing = false, syncErr = "", offArmed = false;
try{ sync = JSON.parse(localStorage.getItem(SYNC_KEY) || "null"); outbox = JSON.parse(localStorage.getItem(OUT_KEY) || "[]") }catch(e){}
const saveOutbox = () => { try{ localStorage.setItem(OUT_KEY, JSON.stringify(outbox)) }catch(e){} };
const withName = t => ({...t, catName:(CAT[t.cat]||CAT.khac).n});
function onWrite(op, t){ if(!sync) return; outbox = outbox.filter(o => o.tx.id !== t.id); outbox.push({op, tx:withName(t)}); saveOutbox(); flush() }
async function api(body){
  const r = await fetch(sync.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({...body, key:sync.key})});
  const j = await r.json(); if(j.error) throw new Error(j.error); return j;
}
const errText = e => e && e.message==="key" ? "Sai mã khóa đồng bộ. Kiểm tra lại ở mục Đồng bộ." : "Chưa đồng bộ được, app sẽ tự thử lại khi có mạng.";
async function flush(){
  if(!sync || syncing || !outbox.length || !navigator.onLine){ renderSync(); return }
  syncing = true; renderSync(); const batch = outbox.slice(0, 200);
  try{ await api({action:"push", ops:batch});
    outbox = outbox.filter(o => !batch.some(b => b.tx.id===o.tx.id && b.tx.u===o.tx.u)); saveOutbox(); syncErr = "";
  }catch(e){ syncErr = errText(e) }
  syncing = false; renderSync();
  if(!syncErr && outbox.length) flush();
}
async function pull(){
  const r = await api({action:"pull"});
  const only = store.reconcile(r.tx||[], r.del||[], new Set(outbox.map(o=>o.tx.id)));
  for(const t of only) outbox.push({op:"upsert", tx:withName(t)});
  if(only.length) saveOutbox();
  return (r.tx||[]).length;
}
async function syncNow(){
  if(!sync || !store || !navigator.onLine){ renderSync(); return }
  try{ await pull(); syncErr = "" }catch(e){ syncErr = errText(e) }
  renderBackup(); await flush();
}
function renderSync(){
  const on = !!sync; $("syncForm").hidden = on; $("sOff").hidden = !on; $("sGo").textContent = on ? "Đồng bộ ngay" : "Kết nối";
  $("syncInfo").textContent = !on ? "Chưa kết nối. Dán địa chỉ Web App và mã khóa từ Google Sheets của bạn."
    : syncing ? "Đang đồng bộ…" : outbox.length ? "Còn " + outbox.length + " thay đổi chờ gửi lên Sheets." : "Đã kết nối. Mọi khoản đã lên Google Sheets.";
  let last = 0; try{ last = +localStorage.getItem("sothuchi.backup") || 0 }catch(e){}
  const days = last ? Math.floor((Date.now()-last)/864e5) : null;
  const due = !on && store && store.all().length >= 10 && (days===null || days >= 14);
  if(on && syncErr) setStatus(syncErr, true);
  else if(on && outbox.length && !navigator.onLine) setStatus("Đang mất mạng. " + outbox.length + " thay đổi sẽ gửi lên Sheets khi có mạng.", false);
  else setStatus(due ? "Đã lâu chưa sao lưu. Vào Tháng này, kéo xuống cuối để xuất file." : "", due);
}
$("sGo").onclick = async () => {
  if(sync){ await syncNow(); showToast(syncErr || "Đã đồng bộ với Google Sheets.", false); return }
  const url = $("sUrl").value.trim(), key = $("sKey").value.trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url) || !key){ showToast("Địa chỉ phải có dạng https://script.google.com/.../exec và cần có mã khóa.", false); return }
  sync = {url, key}; $("sGo").disabled = true; $("syncInfo").textContent = "Đang kết nối…";
  try{ const n = await pull(); syncErr = "";
    try{ localStorage.setItem(SYNC_KEY, JSON.stringify(sync)) }catch(e){}
    showToast("Đã kết nối. Tải về " + n + " khoản từ Sheets.", false); renderBackup(); flush();
  }catch(e){ sync = null; showToast(e && e.message==="key" ? "Sai mã khóa." : "Không kết nối được. Kiểm tra lại địa chỉ Web App.", false) }
  $("sGo").disabled = false; renderSync();
};
$("sOff").onclick = () => {
  if(!offArmed){ offArmed = true; $("sOff").textContent = "Chạm lần nữa để ngắt"; setTimeout(()=>{ offArmed = false; $("sOff").textContent = "Ngắt kết nối" }, 4000); return }
  offArmed = false; $("sOff").textContent = "Ngắt kết nối"; sync = null; outbox = []; syncErr = "";
  try{ localStorage.removeItem(SYNC_KEY); localStorage.removeItem(OUT_KEY) }catch(e){}
  renderBackup(); showToast("Đã ngắt đồng bộ. Dữ liệu trên máy vẫn giữ nguyên.", false);
};

renderAmount(); renderCats(); renderMonth();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(location.hash === "#thang") showTab(true);
boot();
})();
</script>
